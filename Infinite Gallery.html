<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infinite Gallery</title>
<style>
:root{--bg:#E3E6EA;--ink:#1A2030;--veil:rgba(227,230,234,.92);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161D;--ink:#E8EAEE;--veil:rgba(18,22,29,.94)}}
:root[data-theme="dark"]{--bg:#12161D;--ink:#E8EAEE;--veil:rgba(18,22,29,.94)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#stage{position:fixed;inset:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;will-change:transform}
.tile{position:absolute;display:flex;flex-direction:column;outline-offset:3px}
.art{flex:1;min-height:0;overflow:hidden;border-radius:4px}
.cap{flex:none;height:50px;padding:6px 1px 0;overflow:hidden;font-size:12px;line-height:1.3}
.cap b{font-weight:600}
.cap span{opacity:.7}
.note{position:absolute;overflow:hidden;padding:4px 12px 4px 2px;font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.5}
.note.sm{font-size:13px;line-height:1.45}
.note h2{margin:0 0 .5em;font-size:1.3em;line-height:1.2;font-weight:600}
.note p{margin:0 0 .6em;max-width:36ch}
.tile:focus-visible{outline:2px solid var(--ink)}
.tile svg{display:block;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.tile:hover svg{transform:scale(1.06)}
#hint{position:fixed;left:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:8px 12px;border-radius:999px;background:var(--veil);font-size:14px;transition:opacity .6s;pointer-events:none}
#hint.gone{opacity:0}
#lb{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--veil);cursor:zoom-out;z-index:5}
#space{position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:999px;background:var(--veil);font-size:14px;z-index:2}
#space input{width:110px;accent-color:var(--ink)}
#view,#more{font:inherit;font-size:14px;color:var(--ink);padding:8px 14px;border-radius:999px;border:0;background:var(--veil);box-shadow:0 0 0 1px rgba(128,128,128,.4);cursor:pointer}
#view{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px));z-index:3}
#more{display:block;margin:24px auto 0}
#view:focus-visible,#more:focus-visible,.row:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#list{position:fixed;inset:0;z-index:1;overflow-y:auto;background:var(--bg);padding:calc(70px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
#list[hidden]{display:none}
#list ul{list-style:none;margin:0 auto;padding:0;max-width:720px}
#list li{border-top:1px solid rgba(128,128,128,.3)}
.row{display:flex;align-items:center;gap:16px;width:100%;padding:12px 0;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:zoom-in}
.thumb{flex:none;width:96px;height:96px;border-radius:4px;overflow:hidden}
.thumb svg{display:block;width:100%;height:100%}
.row .cap{height:auto;padding:0;overflow:visible;font-size:22px;line-height:1.35}
#peek{position:fixed;left:0;top:0;z-index:4;width:260px;pointer-events:none;border-radius:4px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.28)}
#peek[hidden]{display:none}
#peek svg{display:block;width:100%;aspect-ratio:var(--ar)}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:50%;background:var(--ink);color:var(--bg);font-size:26px;line-height:1;cursor:pointer}
.nav.prev{left:16px}.nav.next{right:16px}
.listmode #space,.listmode #hint{display:none}
#hint{max-width:calc(100% - 32px)}
#list{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#lb{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (max-width:640px){
  .nav{top:auto;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:none}
  .nav.prev{left:calc(50% - 56px)}
  .nav.next{right:auto;left:calc(50% + 12px)}
  .row .cap{font-size:19px}
  #list{padding-left:20px;padding-right:20px}
}
@media (hover:none){#peek{display:none!important}}
#lb[hidden]{display:none}
#lb figure{margin:0}
#lb .cap{height:auto;padding-top:10px;font-size:15px;overflow:visible}
#lb svg{width:min(86vw,calc(62vh * var(--ar)));aspect-ratio:var(--ar);border-radius:6px;display:block}
@media (prefers-reduced-motion:reduce){.tile svg{transition:none}.tile:hover svg{transform:none}}
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>
<div id="hint">Drag, scroll, or use the arrow keys</div>
<button id="view" type="button">List view</button>
<div id="peek" hidden></div>
<div id="list" hidden><ul></ul><button id="more" type="button">Show more</button></div>

<div id="lb" hidden role="dialog" aria-label="Enlarged tile"></div>
<script>
(function(){
  var U=288,G=150,CW=U*6;
  // [col,row,w,h] — a 6×6 block that tiles exactly, repeated forever
  var L=[[0,0,2,2],[2,0,2,1],[4,0,1,2],[5,0,1,1],[2,1,1,1],[3,1,1,1],[5,1,1,2],[0,2,1,1],[1,2,2,2],[3,2,2,1],[0,3,1,2],[3,3,1,1],[4,3,2,1],[1,4,1,2],[2,4,2,2],[4,4,1,1],[5,4,1,2],[0,5,1,1],[4,5,1,1]];
  var P=["#F2682B","#7FB7E6","#3F6B4F","#B9A6E8","#F3D36B","#E8708F","#EDEAE4","#1A2030"];
  var stage=document.getElementById("stage"),world=document.getElementById("world"),hint=document.getElementById("hint"),lb=document.getElementById("lb");
  var pool=new Map(),ox=CW/2-innerWidth/2,oy=CW/2-innerHeight/2,vx=0,vy=0,drag=false,lx=0,ly=0,moved=0,lastRange="";

  function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  function makeTile(cx,cy,i){
    var l=L[i],el=document.createElement("div"),seed=(cx*73856093)^(cy*19349663)^(i*83492791);
    el.className="tile";el.tabIndex=0;el.setAttribute("role","button");el.setAttribute("aria-label","Open tile");
    el.dataset.ar=l[2]/l[3];
    el.style.cssText="left:"+(cx*CW+l[0]*U+G/2)+"px;top:"+(cy*CW+l[1]*U+G/2)+"px;width:"+(l[2]*U-G)+"px;height:"+(l[3]*U-G)+"px";
    var r=rng(seed),a=art(r,l[2],l[3]),cap=caption(r);
    el.dataset.cap=cap;
    el.innerHTML='<div class="art">'+a+'</div><div class="cap">'+cap+'</div>';
    return el;
  }

  // Attributions: Name, Medium, Author. Swap these lists (or hard-code per tile) with your real credits.
  var N1=["Quiet","Slow","Folded","Open","Second","Late","Paper","Low"],N2=["Orbit","Grid","Tide","Signal","Garden","Ladder","Harbour","Echo"],
      MED=["Risograph","Gouache","Screenprint","Laser-cut paper","Ink","Collage"],AU=["M. Okafor","J. Takeda","I. Varga","T. Lindqvist","P. Raman","S. Duarte"];
  function pick(r,a){return a[Math.floor(r()*a.length)]}
  function caption(r){return"<b>"+pick(r,N1)+" "+pick(r,N2)+"</b>, <span>"+pick(r,MED)+", "+pick(r,AU)+"</span>"}

  // Text blocks: slot index in L -> size. They rotate through the lists below, one per 6×6 block.
  var NOTES={8:"",12:"sm"};
  var TEXTS=[
    {h:"This is my playground",p:["Replace this with your own words. Text blocks sit in the grid like tiles and move with everything else.","Edit the TEXTS list in the script."]},
    {h:"A note on process",p:["I wanted my graphic design work to sit similar to how work sits in the Frick Gallery in New York --- Vaguely Connected"]},
    {h:"Just a place to experiement",p:["Short passages work best here. Around fifty words fit comfortably in this space."]},
    {h:"Keep exploring",p:["The wall repeats forever, so every text block returns. Add more entries and they will rotate."]}
  ];
  var SMALL=["A short aside can go here, a line or two beside the work.","Use this strip for a quote, a date, or a credit.","Small notes fit about thirty words.","Another short note, to rotate through the wall."];
  function make(cx,cy,i){
    if(NOTES[i]===undefined)return makeTile(cx,cy,i);
    var l=L[i],el=document.createElement("div"),small=NOTES[i]==="sm",n=((cx*3+cy*5)%4+4)%4,t;
    el.className="note"+(small?" sm":"");
    el.style.cssText="left:"+(cx*CW+l[0]*U+G/2)+"px;top:"+(cy*CW+l[1]*U+G/2)+"px;width:"+(l[2]*U-G)+"px;height:"+(l[3]*U-G)+"px";
    if(small)el.innerHTML="<p>"+SMALL[n]+"</p>";
    else{t=TEXTS[n];el.innerHTML="<h2>"+t.h+"</h2><p>"+t.p.join("</p><p>")+"</p>"}
    return el;
  }

  function render(){
    world.style.transform="translate3d("+-ox+"px,"+-oy+"px,0)";
    var pad=240,x0=Math.floor((ox-pad)/CW),x1=Math.floor((ox+innerWidth+pad)/CW),y0=Math.floor((oy-pad)/CW),y1=Math.floor((oy+innerHeight+pad)/CW),range=[x0,x1,y0,y1].join();
    if(range===lastRange)return;lastRange=range;
    var need=new Set(),cx,cy,i,key;
    for(cy=y0;cy<=y1;cy++)for(cx=x0;cx<=x1;cx++)for(i=0;i<L.length;i++){
      key=cx+","+cy+","+i;need.add(key);
      if(!pool.has(key)){var el=make(cx,cy,i);pool.set(key,el);world.appendChild(el)}
    }
    pool.forEach(function(el,k){if(!need.has(k)){el.remove();pool.delete(k)}});
  }

  function loop(){
    if(!drag&&(vx||vy)){
      ox+=vx;oy+=vy;vx*=.93;vy*=.93;
      if(Math.abs(vx)<.05)vx=0;if(Math.abs(vy)<.05)vy=0;
    }
    render();requestAnimationFrame(loop);
  }

  function seen(){hint.classList.add("gone")}
  stage.addEventListener("pointerdown",function(e){drag=true;moved=0;lx=e.clientX;ly=e.clientY;vx=vy=0;stage.classList.add("drag")});
  window.addEventListener("pointermove",function(e){
    if(!drag)return;
    var dx=lx-e.clientX,dy=ly-e.clientY;lx=e.clientX;ly=e.clientY;
    moved+=Math.abs(dx)+Math.abs(dy);ox+=dx;oy+=dy;vx=dx;vy=dy;if(moved>6)seen();
  });
  window.addEventListener("pointerup",function(e){
    if(!drag)return;drag=false;stage.classList.remove("drag");
    var t=e.target.closest&&e.target.closest(".tile");
    if(moved<6&&t){open(t);vx=vy=0}
  });
  stage.addEventListener("wheel",function(e){e.preventDefault();ox+=e.deltaX;oy+=e.deltaY;vx=vy=0;seen()},{passive:false});
  window.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT")return;
    if(!lb.hidden){if(e.key==="Escape")close();else if(cur>=0&&(e.key==="ArrowRight"||e.key==="ArrowLeft"))show(cur+(e.key==="ArrowRight"?1:-1));return}
    if(!listEl.hidden)return;
    var k={ArrowLeft:[-14,0],ArrowRight:[14,0],ArrowUp:[0,-14],ArrowDown:[0,14]}[e.key];
    if(k){e.preventDefault();vx+=k[0];vy+=k[1];seen()}
    else if((e.key==="Enter"||e.key===" ")&&document.activeElement.classList.contains("tile")){e.preventDefault();open(document.activeElement)}
  });

  var opener=null;
  function open(t){cur=-1;opener=t;lb.style.setProperty("--ar",t.dataset.ar);lb.innerHTML='<figure>'+t.querySelector(".art").innerHTML+'<div class="cap">'+t.dataset.cap+'</div></figure>';lb.hidden=false}
  function close(){lb.hidden=true;lb.innerHTML="";if(opener&&opener.focus)opener.focus({preventScroll:true})}
  lb.addEventListener("click",function(e){var b=e.target.closest(".nav");if(b){e.stopPropagation();show(cur+ +b.dataset.d)}else close()});


  // List view: the pieces of each 19-slot block, in order; "Show more" adds the next block.
  var listEl=document.getElementById("list"),viewBtn=document.getElementById("view"),items=[],cur=-1,page=0;
  function addPage(){
    var ul=listEl.querySelector("ul"),i,el,k,li;
    for(i=0;i<L.length;i++){
      if(NOTES[i]!==undefined)continue;
      el=makeTile(page,0,i);
      items.push({svg:el.querySelector(".art").innerHTML,ar:el.dataset.ar,cap:el.dataset.cap});
      k=items.length-1;
      li=document.createElement("li");
      li.innerHTML='<button class="row" type="button" data-k="'+k+'"><span class="cap">'+items[k].cap+'</span></button>';
      ul.appendChild(li);
    }
    page++;
  }
  function show(k){
    if(k<0||k>=items.length)return;
    cur=k;peek.hidden=true;lb.style.setProperty("--ar",items[k].ar);
    lb.innerHTML='<figure>'+items[k].svg+'<div class="cap">'+items[k].cap+'</div></figure><button class="nav prev" type="button" data-d="-1" aria-label="Previous piece">\u2039</button><button class="nav next" type="button" data-d="1" aria-label="Next piece">\u203A</button>';
    lb.hidden=false;
  }
  listEl.addEventListener("click",function(e){var b=e.target.closest(".row");if(b){opener=b;show(+b.dataset.k)}});
  // Hover preview: the piece follows the cursor while a row is hovered.
  var peek=document.getElementById("peek");
  function move(e){
    var w=260,h=w/(+peek.style.getPropertyValue("--ar")||1),x=e.clientX+24,y=e.clientY+24;
    if(x+w>innerWidth-8)x=e.clientX-w-24;
    if(y+h>innerHeight-8)y=innerHeight-h-8;
    if(y<8)y=8;
    peek.style.transform="translate("+x+"px,"+y+"px)";
  }
  listEl.addEventListener("mouseover",function(e){
    var b=e.target.closest(".row");
    if(!b){peek.hidden=true;return}
    var it=items[+b.dataset.k];
    peek.style.setProperty("--ar",it.ar);peek.innerHTML=it.svg;peek.hidden=false;move(e);
  });
  listEl.addEventListener("mousemove",move);
  listEl.addEventListener("mouseleave",function(){peek.hidden=true});
  document.getElementById("more").addEventListener("click",addPage);
  viewBtn.addEventListener("click",function(){
    var on=listEl.hidden;
    if(on&&!items.length)addPage();
    listEl.hidden=!on;peek.hidden=true;document.body.classList.toggle("listmode",on);
    viewBtn.textContent=on?"Grid view":"List view";
  });

  // Mobile: a tighter gap on narrow screens so more of the grid fits; tile size stays the same.
  function applyLayout(){
    var nG=innerWidth<640?64:150;
    if(nG===G)return;
    var fx=(ox+innerWidth/2)/CW,fy=(oy+innerHeight/2)/CW;
    G=nG;U=138+nG;CW=U*6;
    ox=fx*CW-innerWidth/2;oy=fy*CW-innerHeight/2;vx=vy=0;
    pool.forEach(function(el){el.remove()});pool.clear();lastRange="";
  }
  applyLayout();
  addEventListener("resize",applyLayout);
  window.addEventListener("pointercancel",function(){drag=false;stage.classList.remove("drag")});
  if(matchMedia("(hover:none)").matches)hint.textContent="Drag to explore, tap a tile to enlarge";

  loop();
})();
</script>
</body>
</html>
