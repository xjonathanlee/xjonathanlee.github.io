<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jonathan Lee - Portfolio</title>
<link href="css/horse-main.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<link rel="icon" href="img/favicon.ico">
<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #000;
    font-family: inherit;
  }

  .hero-video-section {
    position: relative;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
  }

  .hero-video-section video {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    transform: translate(-50%, -50%);
    object-fit: cover;
  }

  .header-nav {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 20;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  /* Top-Left Video Grid Menu Container */
  .video-menu-wrapper {
    position: relative;
  }

  .menu-toggle-btn {
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 10px 16px;
    border-radius: 30px;
    font-size: 14px;
    cursor: pointer;
    backdrop-filter: blur(5px);
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .menu-toggle-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.8);
  }

  /* Dropdown Grid List */
  .video-grid-dropdown {
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    background: rgba(15, 15, 15, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    padding: 16px;
    width: 280px;
    backdrop-filter: blur(12px);
    display: none; /* Toggled via JavaScript */
    grid-template-columns: 1fr;
    gap: 10px;
    z-index: 30;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .video-grid-dropdown.active {
    display: grid;
  }

  .video-grid-item {
    color: #ccc;
    text-decoration: none;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.05);
    transition: all 0.2s ease;
  }

  .video-grid-item:hover, .video-grid-item.current {
    color: #fff;
    background: rgba(255, 255, 255, 0.2);
  }

  /* Sleek minimalist audio toggle button styling */
  .audio-control-btn {
    position: absolute;
    bottom: 30px;
    right: 30px;
    z-index: 10;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 10px 16px;
    border-radius: 30px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    backdrop-filter: blur(5px);
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .audio-control-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.8);
  }
</style>
</head>
<body class="splash-river">

<nav class="header-nav">
  <!-- Top-Left Video Grid Menu -->
  <div class="video-menu-wrapper">
    <button id="menuToggle" class="menu-toggle-btn">Index / Videos ▾</button>
    <div id="videoDropdown" class="video-grid-dropdown">
      <a href="riverrunnerindex.html" class="video-grid-item">Main Index</a>
      <!-- Add your other video links here -->
      <a href="intermezzo_eq.html" class="video-grid-item current">Intermezzo EQ</a>
      <a href="video-two.html" class="video-grid-item">Project Title Two</a>
      <a href="video-three.html" class="video-grid-item">Project Title Three</a>
      <a href="video-four.html" class="video-grid-item">Project Title Four</a>
    </div>
  </div>

  <a href="riverrunnerindex.html" class="nav-item-alt" style="color: #fff; text-decoration: none; font-size: 14px; padding-top: 10px;">Back to Index</a>
</nav>

<section class="hero-video-section">
  <video 
    id="heroVideo"
    autoplay 
    muted 
    loop 
    playsinline 
    webkit-playsinline
    poster="img/MEGAN_EQ.PNG">
    <source src="img/Riverrunner/intermezzo_optimized.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Mute / Unmute Button -->
  <button id="audioToggle" class="audio-control-btn">Unmute</button>
</section>

<script>
  const video = document.getElementById('heroVideo');
  const audioBtn = document.getElementById('audioToggle');
  const menuToggle = document.getElementById('menuToggle');
  const videoDropdown = document.getElementById('videoDropdown');

  // Toggle audio state
  audioBtn.addEventListener('click', function() {
    if (video.muted) {
      video.muted = false;
      audioBtn.textContent = 'Mute';
    } else {
      video.muted = true;
      audioBtn.textContent = 'Unmute';
    }
  });

  // Toggle video grid dropdown menu
  menuToggle.addEventListener('click', function(e) {
    e.stopPropagation();
    videoDropdown.classList.toggle('active');
  });

  // Close dropdown when clicking anywhere else on the page
  document.addEventListener('click', function() {
    videoDropdown.classList.remove('active');
  });
</script>

</body>
</html>
