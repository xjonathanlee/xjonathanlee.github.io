<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;

    background-color: #000;

  .hero-video-section {

  .hero-video-section video {
    position: absolute;
    top: 50%;

  }

  :root {
    --text-main: #c4c4c4;
    --text-muted: #888888;

  }

  .nav-container {
    position: absolute;
    top: 25px;
    left: 25px;
    z-index: 30;
  }

  /* Permanent Editorial Dropdown Menu with Subtle Gradient & Fade Transition */
  .editorial-nav {
    position: relative;
    font-size: 0.75rem;
    /* Subtle vertical gradient background */
    /* Gradient: Solid black at top -> clear black in middle -> completely transparent at bottom */
   /* background: radial-gradient(circle at 0% 0%, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.7) 35%, rgba(0, 0, 0, 0.25) 70%, rgba(0, 0, 0, 0) 100%); */
    /* backdrop-filter: blur(12px); */
    /* -webkit-backdrop-filter: blur(12px); */
    /* border: 1px solid rgba(255, 255, 255, 0.08); */
    /* border-radius: 12px; */
    padding: 24px;
    box-sizing: border-box;
    /* box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); */
    
    /* Fade transition configuration */
    opacity: 1;
    visibility: visible;
    transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out;
  }

  /* Hidden state triggered by JS after 15 seconds of inactivity */
  .editorial-nav.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .nav-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(110px, 1fr));
    gap: 4rem;
    width: 100%;
    max-width: 460px;
  }

  .nav-column {
    display: flex;
    flex-direction: column;
  }

  .nav-header {
    font-size: 1rem;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .nav-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .nav-item a {
    color: var(--text-main);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 400;
    transition: color 0.2s ease, transform 0.2s ease;
    display: inline-block;
  }

  .nav-item a:hover {
    color: var(--text-hover);
    transform: translateX(3px);
  }

  /* Sleek minimalist audio toggle button styling */
  .audio-control-btn {
    position: absolute;
    bottom: 30px;
    right: 30px;
    z-index: 30;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 10px 16px;
    border-radius: 30px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    backdrop-filter: blur(5px);
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .audio-control-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.8);
  }

  @media (max-width: 600px) {
    .editorial-nav {
      width: calc(100vw - 50px);
      max-width: 320px;
    }
    .nav-grid {
      grid-template-columns: 1fr;
      gap: 16px;
    }
  }
</style>

<section class="hero-video-section">
  <video 
    id="heroVideo"
    autoplay 
    muted 
    playsinline 
    webkit-playsinline
    poster="img/MEGAN_EQ.PNG">
    <source src="img/Riverrunner/hnema_opt.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Mute / Unmute Button -->
  <button id="audioToggle" class="audio-control-btn">Unmute</button>
</section>

<script>
  const video = document.getElementById('heroVideo');
  const audioBtn = document.getElementById('audioToggle');

  // Toggle audio state
  audioBtn.addEventListener('click', function() {
    if (video.muted) {
      video.muted = false;
      audioBtn.textContent = 'Mute';
    } else {
      video.muted = true;
      audioBtn.textContent = 'Unmute';
    }
  });

  // 15-Second Inactivity Fade-Out Logic
  let fadeTimeout;
  const menuNav = document.querySelector('.editorial-nav');

  function resetMenuTimer() {
    // Show the menu immediately on activity
    menuNav.classList.remove('hidden');
    
    // Clear any existing countdown
    clearTimeout(fadeTimeout);
    
    // Start a new 15-second timer (15000 milliseconds)
    fadeTimeout = setTimeout(() => {
      menuNav.classList.add('hidden');
    }, 15000);
  }

  // Initialize the timer when the page loads
  resetMenuTimer();

  // Reset the timer whenever the user moves the mouse, presses a key, or touches the screen
  window.addEventListener('mousemove', resetMenuTimer);
  window.addEventListener('keydown', resetMenuTimer);
  window.addEventListener('touchstart', resetMenuTimer);
</script>
