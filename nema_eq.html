<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  .hero-video-section {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  .hero-video-section video {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    transform: translate(-50%, -50%);
    object-fit: cover;
  }

  @media (max-width: 600px) and (orientation: portrait) {
    .hero-video-section video { object-fit: contain; }
  }

  :root {
    --text-main: #c4c4c4;
    --text-muted: #888888;
    --text-hover: #c2c2c2;
  }

  .nav-container {
    position: absolute;
    top: 25px;
    left: 25px;
    z-index: 50;
  }

  .menu-btn {
    display: none;
  }

  /* Permanent Editorial Dropdown Menu with Subtle Gradient & Fade Transition */
  .editorial-nav {
    position: relative;
    font-size: 0.75rem;
    /* Subtle vertical gradient background */
    /* Gradient: Solid black at top -> clear black in middle -> completely transparent at bottom */
   /* background: radial-gradient(circle at 0% 0%, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.7) 35%, rgba(0, 0, 0, 0.25) 70%, rgba(0, 0, 0, 0) 100%); */
    /* backdrop-filter: blur(12px); */
    /* -webkit-backdrop-filter: blur(12px); */
    /* border: 1px solid rgba(255, 255, 255, 0.08); */
    /* border-radius: 12px; */
    padding: 24px;
    box-sizing: border-box;
    /* box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); */
    
    /* Fade transition configuration */
    opacity: 1;
    visibility: visible;
    transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out;
  }

  /* Hidden state triggered by JS after 15 seconds of inactivity */
  .editorial-nav.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .nav-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(110px, 1fr));
    gap: 4rem;
    width: 100%;
    max-width: 460px;
  }

  .nav-column {
    display: flex;
    flex-direction: column;
  }

  .nav-header {
    font-size: 1rem;
    color: var(--text-muted);
    margin-bottom: 12px;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
  }

  .nav-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .nav-item a {
    color: var(--text-main);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 400;
    transition: color 0.2s ease, transform 0.2s ease;
    display: inline-block;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
  }

  @media (hover: hover) {
    .nav-item a:hover {
      color: var(--text-hover);
      transform: translateX(10px);
    }
  }

  .video-splash {
    position: absolute;
    inset: 0;
    z-index: 40;
    display: grid;
    place-items: center;
    filter: saturate(0);
    background: url("img/Riverrunner/nema.jpg") center / cover no-repeat;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }

  .video-splash.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .splash-play-button {
    display: grid;
    justify-items: center;
    gap: 12px;
    padding: 0;
    color: #fff;
    background: none;
    border: 0;
    font: inherit;
    cursor: pointer;
  }

  .splash-play-icon {
    display: grid;
    width: 84px;
    height: 84px;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.6);
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .splash-play-button:hover .splash-play-icon {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.08);
  }

  .splash-play-button:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 6px;
  }

  .splash-play-icon svg {
    width: 30px;
    height: 30px;
    fill: currentColor;
  }

  /* Sleek minimalist audio toggle button styling */
  .audio-control-btn {
    position: absolute;
    bottom: calc(30px + env(safe-area-inset-bottom, 0px));
    right: 30px;
    z-index: 30;
    min-height: 44px;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 10px 16px;
    border-radius: 30px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .audio-control-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.8);
  }

  @media (max-width: 600px) {
    .nav-container {
      top: calc(12px + env(safe-area-inset-top, 0px));
      left: 12px;
    }

    .menu-btn {
      display: block;
      min-height: 44px;
      padding: 10px 16px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font: inherit;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 30px;
      cursor: pointer;
      -webkit-backdrop-filter: blur(5px);
      backdrop-filter: blur(5px);
    }

    .editorial-nav {
      display: none;
      margin-top: 8px;
      padding: 12px 16px;
      width: calc(100vw - 24px);
      max-width: 320px;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 12px;
    }

    .editorial-nav.open {
      display: block;
    }

    .nav-grid {
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .nav-item a {
      padding: 10px 0;
    }

    .audio-control-btn {
      right: 16px;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    }
  }
</style>
</head>
<body class="splash-river">

<section class="hero-video-section">
  <video 
    id="heroVideo"
    playsinline 
    webkit-playsinline
    preload="metadata"
    poster="img/MEGAN_EQ.PNG">
    <source src="img/Riverrunner/hnema_opt.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <div id="videoSplash" class="video-splash">
    <button id="splashPlay" class="splash-play-button" type="button" aria-label="Play video">
      <span class="splash-play-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </span>
      <span>Play</span>
    </button>
  </div>

  <!-- Mute / Unmute Button -->
  <button id="audioToggle" class="audio-control-btn" type="button">Unmute</button>
</section>

<script>
  const video = document.getElementById('heroVideo');
  const audioBtn = document.getElementById('audioToggle');
  const videoSplash = document.getElementById('videoSplash');
  const splashPlayBtn = document.getElementById('splashPlay');
  const menuNav = document.querySelector('.editorial-nav');
  const menuBtn = document.getElementById('menuBtn');

  video.muted = false;

  function updateAudioButton() {
    audioBtn.textContent = video.muted ? 'Unmute' : 'Mute';
  }

  splashPlayBtn.addEventListener('click', async function() {
    video.muted = false;
    updateAudioButton();

    if (video.paused) {
      try {
        await video.play();
      } catch (error) {
        console.error('Video playback failed:', error);
        return;
      }
    }

    videoSplash.classList.add('hidden');
  });

  // Toggle audio state
  audioBtn.addEventListener('click', function() {
    video.muted = !video.muted;
  });
  video.addEventListener('volumechange', updateAudioButton);
  updateAudioButton();

  function closeMenu() {
    menuNav.classList.remove('open');
    menuBtn.setAttribute('aria-expanded', 'false');
  }

  menuBtn.addEventListener('click', function() {
    const isOpen = menuNav.classList.toggle('open');
    menuBtn.setAttribute('aria-expanded', String(isOpen));
  });

  video.addEventListener('click', function() {
    if (menuNav.classList.contains('open')) {
      closeMenu();
      return;
    }
    if (video.paused) { video.play(); } else { video.pause(); }
  });

  // 15-Second Inactivity Fade-Out Logic
  let fadeTimeout;

  function resetMenuTimer() {
    // Show the menu immediately on activity
    menuNav.classList.remove('hidden');
    
    // Clear any existing countdown
    clearTimeout(fadeTimeout);
    
    // Keep an open mobile menu visible until it is closed.
    fadeTimeout = setTimeout(() => {
      if (!menuNav.classList.contains('open')) {
        menuNav.classList.add('hidden');
      }
    }, 15000);
  }

  // Initialize the timer when the page loads
  resetMenuTimer();

  // Reset the timer whenever the user moves the mouse, presses a key, or touches the screen
  window.addEventListener('mousemove', resetMenuTimer);
  window.addEventListener('keydown', resetMenuTimer);
  window.addEventListener('touchstart', resetMenuTimer, { passive: true });
</script>
