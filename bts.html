<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Behind the Scenes</title>
<link rel="stylesheet" href="css/horse-main.css">
</head>
<body class="bts-page">
<nav class="header-nav">
  <a class="nav-item-alt" href="#">Credits</a>
  <a class="nav-item-alt" href="#">Return home</a>
</nav>

<section class="pin" id="pin" aria-label="Behind the scenes gallery">
  <div class="stage">
    <div class="viewport">
      <div class="track" id="track">
        <figure class="item"><div class="ph" style="--l:38%;--ar:3/2"><span>Photo 1</span></div></figure>
        <figure class="item"><div class="ph" style="--l:30%;--ar:16/9"><span>Photo 2</span></div></figure>
        <figure class="item"><div class="ph" style="--l:42%;--ar:2/3"><span>Photo 3</span></div></figure>
        <figure class="item"><div class="ph" style="--l:34%;--ar:3/2"><span>Video 1</span></div></figure>
        <figure class="item"><div class="ph" style="--l:28%;--ar:16/9"><span>Photo 4</span></div></figure>
        <figure class="item"><div class="ph" style="--l:40%;--ar:3/4"><span>Photo 5</span></div></figure>
        <figure class="item"><div class="ph" style="--l:32%;--ar:3/2"><span>Photo 6</span></div></figure>
        <figure class="item"><div class="ph" style="--l:36%;--ar:16/9"><span>Video 2</span></div></figure>
      </div>
    </div>
    <div class="foot">
      <div class="meta">
        <h1>Behind the Scenes</h1>
        <p>The Making of the Project</p>
        <small>City, Country</small>
      </div>
      <div class="line" aria-hidden="true"><i id="fill"></i></div>
    </div>
  </div>
</section>

<script>
(function(){
  var pin=document.getElementById('pin'),track=document.getElementById('track'),fill=document.getElementById('fill');
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var dist=0,ticking=false;
  function measure(){
    dist=Math.max(0,track.scrollWidth-window.innerWidth);
    pin.style.height=(dist+window.innerHeight)+'px';
    update();
  }
  function update(){
    ticking=false;
    var p=dist?Math.min(1,Math.max(0,(window.scrollY-pin.offsetTop)/dist)):0;
    track.style.transform='translate3d('+(-p*dist)+'px,0,0)';
    fill.style.width=(p*100)+'%';
  }
  window.addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(update);}},{passive:true});
  window.addEventListener('resize',measure);
  window.addEventListener('load',measure);
  measure();
})();
</script>
</body>
</html>
