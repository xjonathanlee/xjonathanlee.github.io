<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>River Runners – Offscript</title>
<style>
@font-face {
    font-family: helveticaNeueReg;
    src: url(HelveticaNeue-Regular.otf);
}
@font-face {
    font-family: helveticaNeueLight;
    src: url(HelveticaNeue-Light.otf);
}
@font-face {
    font-family: helveticaNeueItal;
    src: url(HelveticaNeue-RegularItalic.otf);
}
@font-face {
    font-family: helveticaNeueBold;
    src: url(HelveticaNeue-Bold.otf);
}
@font-face{
    font-family:PPEditorialRegular;
    src: url(PPEditorialNew-Ultralight.otf);
}
@font-face{
    font-family:PPEditorialItalic;
    src: url(PPEditorialNew-Italic.otf);
}
@font-face{
    font-family: PPEditorialUltra;
    src: url(PPEditorialNew-Ultrabold.otf);
}
html,body{height:100%;margin:0}
body{overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.p{position:absolute;max-width:90vw;}
.header-nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  box-sizing: border-box; /* Ensures the 8vw padding doesn't cause horizontal overflow */
  display: flex;
  justify-content: flex-end;
  gap: 28px;
  padding: 24px 8vw;
  z-index: 10;
}
.p:not(:has(img)) {
  font-family: 'PPEditorialItalic', Georgia, serif;
  font-size: 42px;
  line-height: 1;
  color: #111;
  /* max-width: min(500px, 85vw); */
  user-select: none;
  pointer-events: none;
}

/* Style the tiny floating cursor preview for quotes */
#pv:not(:has(img)) {
  font-family: 'PPEditorialItalic', Georgia, serif;
  font-size: 12px;
  line-height: 1;
  color: #333;
}
.nav-item-alt {
  color: var(--fg, #000); /* Falls back to black if --fg is not defined */
  text-decoration: none;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0.8;
  transition: opacity 200ms ease;
}

.nav-item-alt:hover {
  opacity: 1;
}
.p img{max-width:min(350px,90vw);max-height:min(500px,70vh)}
#pv{position:fixed;pointer-events:none;opacity:.5;font-size:11px;max-width:120px;display:none;z-index:99999}
#pv img{max-width:80px;max-height:115px}
@media (hover:none){#pv{display:block;left:8px;bottom:8px;max-width:90px}}
</style>
</head>
<body>
<nav class="header-nav">
  <a href="riverrunnerindex.html" class="nav-item-alt">INDEX</a>
  <a href="#" class="nav-item-alt">ABOUT</a>
</nav>
<div id="pv"></div>
<script>
// Pictures appear in this order. Quotes are picked at random from the quotes in the list.
var items=[
 {img:'img/riverrunner/h_nemo.jpg'},
 {quote:'Kid on a pony goin mach 10'},
 {img:'img/riverrunner/n_reno.jpg'},
 {quote:'Does that answer your question?'},
 {img:'img/riverrunner/nema.jpg'},
 {quote:'Reno thinks its a Grand prix'},
 {img:'img/riverrunner/untitled-0406.jpg'},
  {img:'img/riverrunner/horse_picture (1).png'},
  {img:'img/riverrunner/horse_picture (2).png'},
  {img:'img/riverrunner/horse_picture (3).png'},
  {img:'img/riverrunner/horse_picture (4).png'},
  {img:'img/riverrunner/horse_picture (5).png'},
  {img:'img/riverrunner/horse_picture (6).png'},
  {img:'img/riverrunner/horse_picture (7).png'},
  {img:'img/riverrunner/horse_picture (8).png'},
  {img:'img/riverrunner/horse_picture (9).png'},
  {img:'img/riverrunner/horse_picture (10).png'},
  {img:'img/riverrunner/horse_picture (12).png'},
  {img:'img/riverrunner/horse_picture (13).png'},
 {quote:'I am not as bouncy as I used to be'}
];
// Placeholder images drawn in code. Replace ph(...) with 'images/your-file.jpg' for real photos.
function ph(w,h,t,c){return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'"><rect width="100%" height="100%" fill="'+c+'"/><text x="50%" y="50%" font-family="Georgia" font-size="22" fill="#fff" text-anchor="middle">'+t+'</text></svg>')}
var quotes=items.filter(function(i){return i.quote}).map(function(i){return i.quote});
var n=0,z=1,last='',pv=document.getElementById('pv'),next=pick();
function pick(){
 var it=items[n%items.length];
 if(!it.quote)return it;
 var q;do{q=quotes[Math.floor(Math.random()*quotes.length)]}while(q===last&&quotes.length>1);
 last=q;return {quote:q};
}
function fill(el,it){
 el.textContent='';
 if(it.img){var i=new Image();i.src=it.img;i.alt='';el.appendChild(i)}
 else{el.textContent=it.quote}
}
fill(pv,next);
var CYCLE_MS=700,timer;
function advance(){n++;next=pick();fill(pv,next);clearInterval(timer);timer=setInterval(advance,CYCLE_MS)}
timer=setInterval(advance,CYCLE_MS);
// With a mouse the preview follows the cursor. On touch screens it sits in the bottom-left corner.
if(!matchMedia('(hover: none)').matches){
 document.addEventListener('mousemove',function(e){
  pv.style.display='block';pv.style.left=(e.clientX+14)+'px';pv.style.top=(e.clientY+14)+'px';
 });
 document.documentElement.addEventListener('mouseleave',function(){pv.style.display='none'});
}
document.addEventListener('click',function(e){
 var el=document.createElement('div');
 el.className='p';el.style.zIndex=z++;
 fill(el,next);
 document.body.appendChild(el);
 var x=e.clientX,y=e.clientY;
 function fit(){el.style.left=Math.max(0,Math.min(x,innerWidth-el.offsetWidth))+'px';el.style.top=Math.max(0,Math.min(y,innerHeight-el.offsetHeight))+'px'}
 var im=el.querySelector('img');
 if(im){
  // Random size per placed image: both sides >= 120px, aspect ratio preserved
  var size=function(){
   var r=im.naturalWidth/im.naturalHeight||1;      // aspect ratio
   var MIN=120;
   var minW=Math.max(MIN,MIN*r);                    // keeps both sides >= 120
   var maxW=Math.min(350,innerWidth*0.9,500*r,innerHeight*0.7*r);
   if(maxW<minW)maxW=minW;                          // never go below the minimum
   var w=minW+Math.random()*(maxW-minW);
   im.style.maxWidth='none';im.style.maxHeight='none';
   im.style.width=w+'px';im.style.height=(w/r)+'px';
   fit();
  };
  if(im.complete&&im.naturalWidth)size();else im.onload=size;
 }else{fit()}
 advance();
});
</script>
</body>
</html>
