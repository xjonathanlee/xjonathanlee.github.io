<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jonathan Lee - Portfolio</title>
<link href="css/horse-main.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<link rel="icon" href="img/favicon.ico">
<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #000;
  }

  .hero-video-section {
    position: relative;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
  }

  .hero-video-section video {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    transform: translate(-50%, -50%);
    object-fit: cover;
  }

  .header-nav {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 10;
    padding: 20px;
    box-sizing: border-box;
  }

  /* Sleek minimalist audio toggle button styling */
  .audio-control-btn {
    position: absolute;
    bottom: 30px;
    right: 30px;
    z-index: 10;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 10px 16px;
    border-radius: 30px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    backdrop-filter: blur(5px);
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .audio-control-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.8);
  }
</style>
</head>
<body class="splash-river">

<nav class="header-nav">
  <a href="riverrunnerindex.html" class="nav-item-alt">Back to Index</a>
</nav>

<section class="hero-video-section">
  <video 
    id="heroVideo"
    autoplay 
    muted 
    loop 
    playsinline 
    webkit-playsinline
    poster="img/MEGAN_EQ.PNG">
    <source src="img/Riverrunner/intermezzo_optimized.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Mute / Unmute Button -->
  <button id="audioToggle" class="audio-control-btn">Unmute</button>
</section>

<script>
  const video = document.getElementById('heroVideo');
  const audioBtn = document.getElementById('audioToggle');

  audioBtn.addEventListener('click', function() {
    if (video.muted) {
      video.muted = false;
      audioBtn.textContent = 'Mute';
    } else {
      video.muted = true;
      audioBtn.textContent = 'Unmute';
    }
  });
</script>

</body>
</html>
