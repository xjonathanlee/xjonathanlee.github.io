<video-player poster="../img/MEGAN_EQ.PNG">
  <video-skin>
    <!-- Configured with minimal quality selector and disabled text tracks -->
    <youtube-video 
      src="https://www.youtube.com/watch?v=JWBz4MDqM2U&autoplay=1&mute=1&controls=0&rel=0&iv_load_policy=3&cc_load_policy=0">
    </youtube-video>
  </video-skin>
  <media-fullscreen-button></media-fullscreen-button>
</video-player>
 <script>
  document.addEventListener('DOMContentLoaded', () => {
    const ytVideo = document.querySelector('youtube-video');
    if (ytVideo) {
      // Force HD quality 
      ytVideo.quality = 'hd1080';
      
      // Ensure all text tracks/subtitles are turned off programmatically
      const textTracks = ytVideo.textTracks;
      if (textTracks) {
        for (let i = 0; i < textTracks.length; i++) {
          textTracks[i].mode = 'disabled';
        }
      }
    }
  });
</script>
</body>
